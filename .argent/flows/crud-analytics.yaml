steps:
  - echo: Create, query, update, persist, analyze, and delete a synthetic moment
  - launch: com.youmotion.mobile
  - tool: await-screen-idle
    args:
      timeoutMs: 10000
      minStableMs: 500
  - when:
      visible:
        text: Skip
    steps:
      - tap:
          text: Skip
      - await:
          idle: true
  - await:
      visible:
        id: emotion-star
      timeout: 10000
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.503
      toX: 0.75
      toY: 0.503
      durationMs: 800
  - await:
      visible:
        id: reflection-note-input
      timeout: 5000
  - tap:
      id: reflection-note-input
  - tool: keyboard
    args:
      text: ArgentCrudMoment
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.25
  - tap:
      id: reflection-save
  - await:
      visible:
        text: Does a core belief fit this moment?
      timeout: 5000
  - tap:
      id: belief-system-finish
  - await:
      visible:
        text: You arrived with yourself
      timeout: 5000
  - tap:
      id: check-in-done
  - await:
      visible:
        id: emotion-star
      timeout: 5000
  - tap:
      id: tab-history
  - await:
      visible:
        text: YOUR HISTORY
      timeout: 5000
  - tap:
      id: history-search-input
  - tool: keyboard
    args:
      text: ArgentCrudMoment
  - await:
      visible:
        text: ArgentCrudMoment
      timeout: 5000
  - tap:
      text: ArgentCrudMoment
      role: button
  - await:
      visible:
        text: EDIT MOMENT
      timeout: 5000
  - tap:
      id: reflection-note-input
  - tool: keyboard
    args:
      text: Updated
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.3
  - tap:
      id: reflection-save
  - await:
      visible:
        text: Does a core belief fit this moment?
      timeout: 5000
  - tap:
      id: belief-system-finish
  - await:
      visible:
        text: YOUR HISTORY
      timeout: 5000
  - launch: com.youmotion.mobile
  - tool: await-screen-idle
    args:
      timeoutMs: 10000
      minStableMs: 500
  - tap:
      id: tab-history
  - await:
      visible:
        text: ArgentCrudMomentUpdated
      timeout: 5000
  - tap:
      id: tab-analytics
  - await:
      visible:
        text: YOUR INSIGHTS
      timeout: 5000
  - tap:
      id: analytics-timeframe-all
  - await:
      visible:
        text: EMOTIONAL CONSTELLATION
      timeout: 5000
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.8
      toX: 0.5
      toY: 0.32
      durationMs: 800
  - await:
      visible:
        text: "Love: 1"
      timeout: 5000
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.8
      toX: 0.5
      toY: 0.32
      durationMs: 800
  - await:
      visible:
        text: You recorded 1 moments across 1 different days.
      timeout: 5000
  - tap:
      id: tab-history
  - await:
      visible:
        text: ArgentCrudMomentUpdated
      timeout: 5000
  - tool: gesture-tap
    args:
      x: 0.5
      y: 0.43
  - await:
      visible:
        text: Delete moment
      timeout: 5000
  - when:
      platform: ios
    steps:
      - tool: gesture-swipe
        args:
          fromX: 0.5
          fromY: 0.6
          toX: 0.5
          toY: 0.9
          durationMs: 600
  - when:
      platform: android
    steps:
      - tool: button
        args:
          button: back
  - wait: 500
  - tap:
      id: delete-edited-moment
  - when:
      platform: ios
    steps:
      - tool: keyboard
        args:
          key: tab
      - tool: keyboard
        args:
          key: arrow-right
      - tool: keyboard
        args:
          key: enter
  - when:
      platform: android
    steps:
      - tap:
          text:
            matches: '^Delete$'
  - await:
      visible:
        text: YOUR HISTORY
      timeout: 5000
  - await:
      hidden:
        text: ArgentCrudMomentUpdated
      timeout: 5000
  - tap:
      id: tab-analytics
  - await:
      visible:
        text: YOUR INSIGHTS
      timeout: 5000
  - tap:
      id: analytics-timeframe-all
  - await:
      visible:
        text: No moments in this period.
      timeout: 5000
