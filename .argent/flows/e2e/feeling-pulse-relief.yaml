steps:
  - when:
      platform: ios
    steps:
      - launch: com.youmotion.mobile
  - echo: Verify the rounded Feeling Pulse surface and its unchanged drag-to-reflection path without saving data.
  - tool: open-url
    args:
      url: exp+youmotion://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8091
  - run: fragments/ensure-onboarded.yaml
  - run: fragments/ensure-english.yaml
  - await: { visible: { id: emotion-star }, timeout: 30000 }
  - when:
      visible: { id: xmark }
    steps:
      - tap: { id: xmark }
      - await: { hidden: { id: xmark }, timeout: 5000 }
  - assert: { visible: { id: emotion-star } }
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.54
      toX: 0.5
      toY: 0.34
      durationMs: 1000
  - await: { visible: { id: reflection-note-input }, timeout: 10000 }
  - when:
      platform: ios
    steps:
      - tap: { text: What is present right now? }
  - when:
      platform: android
    steps:
      - tool: keyboard
        args: { key: escape }
  - tap: { id: reflection-back }
  - assert: { visible: { id: emotion-star } }
