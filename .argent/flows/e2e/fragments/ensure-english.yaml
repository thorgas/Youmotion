steps:
  - await: { visible: { id: tab-settings }, timeout: 30000 }
  - wait: 3000
  - when:
      visible: { id: xmark }
    steps:
      - tap: { id: xmark }
      - await: { hidden: { id: xmark }, timeout: 5000 }
  - when:
      platform: ios
    steps:
      - tool: gesture-tap
        args: { x: 0.78, y: 0.93 }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.875, y: 0.94 }
  - await: { visible: { id: language-english }, timeout: 10000 }
  - tap: { id: language-english }
  - await: { visible: { text: Your space. }, timeout: 10000 }
  - wait: 1000
  - when:
      platform: ios
    steps:
      - tool: gesture-tap
        args: { x: 0.125, y: 0.93 }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.125, y: 0.94 }
  - await: { visible: { id: emotion-star }, timeout: 10000 }
