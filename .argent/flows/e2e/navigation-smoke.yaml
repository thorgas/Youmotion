steps:
  - when:
      platform: ios
    steps:
      - launch: com.youmotion.mobile
  - echo: Open Youmotion on the dedicated E2E device and verify primary navigation.
  - tool: open-url
    args:
      url: exp+youmotion://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8091
  - run: fragments/ensure-onboarded.yaml
  - run: fragments/ensure-english.yaml
  - await: { visible: { id: tab-today }, timeout: 30000 }
  - when:
      visible: { id: xmark }
    steps:
      - tap: { id: xmark }
      - await: { hidden: { id: xmark }, timeout: 5000 }
  - when:
      platform: ios
    steps:
      - tool: gesture-tap
        args: { x: 0.375, y: 0.96 }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.375, y: 0.94 }
  - await: { visible: { id: history-search-input }, timeout: 5000 }
  - await: { visible: { id: history-filters-toggle }, timeout: 5000 }
  - wait: 1000
  - when:
      platform: ios
    steps:
      - tool: gesture-tap
        args: { x: 0.76, y: 0.93 }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.76, y: 0.93 }
  - await: { visible: { text: Your space. }, timeout: 5000 }
  - wait: 1000
  - when:
      platform: ios
    steps:
      - tool: gesture-tap
        args: { x: 0.125, y: 0.96 }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.125, y: 0.94 }
  - await: { visible: { id: emotion-star }, timeout: 5000 }
