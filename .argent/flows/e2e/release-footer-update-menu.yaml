steps:
  - when:
      platform: ios
    steps:
      - launch: com.youmotion.mobile
  - echo: Long-press the release footer in settings and verify the hidden update menu and the disabled-build alert.
  - tool: open-url
    args:
      url: exp+youmotion://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8091
  - run: fragments/ensure-onboarded.yaml
  - run: fragments/ensure-english.yaml
  - await: { visible: { id: tab-settings }, timeout: 30000 }
  - when:
      visible: { id: xmark }
    steps:
      - tap: { id: xmark }
      - await: { hidden: { id: xmark }, timeout: 5000 }
  - tap: { id: tab-settings }
  - await: { visible: { text: Your space. }, timeout: 10000 }
  - echo: Scroll settings to the bottom so the release footer is on screen.
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.2, durationMs: 400, momentum: false }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.2, durationMs: 400, momentum: false }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.2, durationMs: 400, momentum: false }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.2, durationMs: 400, momentum: false }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.8, toX: 0.5, toY: 0.2, durationMs: 400, momentum: false }
  - await: { visible: { id: workspace-release }, timeout: 10000 }
  - echo: A long press opens the hidden update menu with one switch row per other channel; a plain tap must not.
  - tap: { id: workspace-release }
  - assert: { hidden: { text: Check for update now } }
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.5, y: 0.825 }
        - { type: Up, x: 0.5, y: 0.825, delayMs: 900 }
  - await: { visible: { text: Check for update now }, timeout: 5000 }
  - assert: { visible: { text: Updates · Production } }
  - assert: { visible: { text: Switch to Testing } }
  - assert: { visible: { text: Switch to QA } }
  - assert: { visible: { text: Cancel } }
  - echo: A dev-client build never checks for updates and must say so rather than fail.
  - tap: { text: Check for update now }
  - await: { visible: { text: Updates are disabled in this build }, timeout: 10000 }
  - assert: { visible: { text: This is a development or dev-client build; expo-updates never checks here. } }
  - tap: { text: OK }
  - await: { hidden: { text: Updates are disabled in this build }, timeout: 5000 }
  - await: { idle: true }
  - echo: Cancel closes the menu without acting.
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.5, y: 0.825 }
        - { type: Up, x: 0.5, y: 0.825, delayMs: 900 }
  - await: { visible: { text: Check for update now }, timeout: 5000 }
  - tap: { text: Cancel }
  - await: { hidden: { text: Check for update now }, timeout: 5000 }
  - await: { idle: true }
  - echo: A press outside the sheet dismisses it too.
  - tool: gesture-custom
    args:
      events:
        - { type: Down, x: 0.5, y: 0.825 }
        - { type: Up, x: 0.5, y: 0.825, delayMs: 900 }
  - await: { visible: { text: Check for update now }, timeout: 5000 }
  - tap: { x: 0.5, y: 0.15 }
  - await: { hidden: { text: Check for update now }, timeout: 5000 }
  - assert: { visible: { id: workspace-release } }
