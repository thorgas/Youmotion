steps:
  - echo: Restore the committed neutral archive fixture before populated store captures.
  - launch: com.youmotion.mobile
  - wait: 15000
  - when:
      platform: ios
    steps:
      - when:
          visible: { id: onboarding-skip }
        steps:
          - tap: { id: onboarding-skip }
  - when:
      platform: android
    steps:
      - tool: gesture-tap
        args: { x: 0.89, y: 0.05 }
  - await: { visible: { id: emotion-star }, timeout: 10000 }
  - tap: { id: tab-settings }
  - await: { visible: { id: settings-screen }, timeout: 10000 }
  - scroll-to: { target: { id: delete-all-journal-data }, direction: down }
  - await: { visible: { id: restore-data-archive }, timeout: 5000 }
  - tap: { id: restore-data-archive }
  - when:
      platform: ios
    steps:
      - wait: 3000
      - echo: Tap the fixture at the center of its frame from the iOS document-picker accessibility tree.
      - tool: gesture-tap
        args: { x: 0.176, y: 0.325 }
  - when:
      platform: android
    steps:
      - tap: { text: "Show roots" }
      - tap: { text: "Downloads" }
      - await: { visible: { text: "youmotion-demo-backup.json" }, timeout: 30000 }
      - tap: { text: "youmotion-demo-backup.json" }
  - await: { visible: { id: restore-preview }, timeout: 15000 }
  - scroll-to: { target: { text: "133" }, direction: down }
  - assert: { visible: { text: "133" } }
  - scroll-to: { target: { id: app-release-info }, direction: down }
  - await: { visible: { id: confirm-data-restore }, timeout: 5000 }
  - tap: { id: confirm-data-restore }
  - await: { visible: { id: data-safety-notice }, timeout: 30000 }
  - assert: { hidden: { id: restore-preview } }
  - tap: { id: data-safety-notice }
  - await: { hidden: { id: data-safety-notice }, timeout: 5000 }
  - await: { idle: true }
