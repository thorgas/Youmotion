steps:
  - echo: Restore the committed neutral archive fixture before populated store captures.
  - launch: com.youmotion.mobile
  - await: { visible: { text: "Make space for what is here." }, timeout: 30000 }
  - await: { idle: true }
  - echo: Skip the first-run guide so Settings is available.
  - tap: { x: 0.89, y: 0.09 }
  - await: { visible: { id: emotion-star }, timeout: 10000 }
  - tap: { id: tab-settings }
  - await: { visible: { text: "Your space." }, timeout: 10000 }
  - tool: gesture-swipe
    args:
      fromX: 0.5
      fromY: 0.75
      toX: 0.5
      toY: 0.35
      durationMs: 700
  - await: { idle: true }
  - tap: { id: restore-data-archive }
  - await: { visible: { text: "Browse" }, timeout: 10000 }
  - tap: { id: DOC.sidebar.item.On My iPhone }
  - await: { visible: { text: "youmotion-demo-backup.json" }, timeout: 10000 }
  - tap: { text: "youmotion-demo-backup.json" }
  - await: { visible: { text: "Replace this device's data?" }, timeout: 15000 }
  - tap: { id: confirm-data-restore }
  - await: { visible: { id: emotion-star }, timeout: 30000 }
  - await: { idle: true }
