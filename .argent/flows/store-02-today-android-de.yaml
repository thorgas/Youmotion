steps:
  - launch: com.youmotion.mobile
  - await: { visible: { text: Wie fühlst du dich gerade? }, timeout: 30000 }
  - echo: Create two locale-neutral synthetic E2E moments for populated German store captures.
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.47, toX: 0.5, toY: 0.34, durationMs: 700 }
  - await: { visible: { text: Was ist gerade da? }, timeout: 10000 }
  - when:
      visible: { text: Try out your stylus }
    steps:
      - tap: { text: Cancel }
  - tap: { text: Diesen Moment speichern und abschließen }
  - wait: 800
  - tap: { x: 0.5, y: 0.63 }
  - await: { visible: { text: Wie fühlst du dich gerade? }, timeout: 10000 }
  - tool: gesture-swipe
    args: { fromX: 0.5, fromY: 0.47, toX: 0.72, toY: 0.47, durationMs: 700 }
  - await: { visible: { text: Was ist gerade da? }, timeout: 10000 }
  - tap: { text: Diesen Moment speichern und abschließen }
  - wait: 800
  - tap: { x: 0.5, y: 0.63 }
  - await: { visible: { text: Wie fühlst du dich gerade? }, timeout: 10000 }
  - await: { idle: true }
