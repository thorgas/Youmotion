name: Zero-model checkpoint probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: checkpoint-probe
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-action-harness
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact trusted private harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: thorgas/pi-action
          ref: 99306d2ed82066fe6014c41c8c56c07ef3cf1522
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          path: pi-action-harness
          persist-credentials: false
      - name: Set up production Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          architecture: arm64
      - name: Set up production pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.21.0
          run_install: false
      - name: Install exact trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optimistic-repeat-install
      - name: Select production Node for the isolated probe
        run: printf 'PI_CHECKPOINT_NODE=%s\n' "$(command -v node)" >> "$GITHUB_ENV"
      - name: Capture encrypt upload download and verify without a remote model
        uses: ./pi-action-harness/tooling/github-actions/checkpoint-probe-action
        env:
          GITHUB_TOKEN: ${{ github.token }}
