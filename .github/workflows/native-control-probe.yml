name: Zero-model native control probe
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: native-control-probe
  cancel-in-progress: false
jobs:
  native-control:
    if: github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pi-action-harness
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact trusted private harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: thorgas/pi-action
          ref: 0cfeada8727e656c5f1e87591aac412a71565fd5
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          path: pi-action-harness
          persist-credentials: false
      - name: Set up production Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.21.0
          architecture: arm64
      - name: Set up production pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 11.21.0
          run_install: false
      - name: Install exact trusted dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optimistic-repeat-install
      - name: Verify bare simulator viewing and fenced manual input without a model
        run: |
          test -n "$PI_ACTION_PROFILE_JSON"
          node tooling/github-actions/native-control-probe.mjs
        env:
          PI_ACTION_PROFILE_JSON: ${{ vars.PI_ACTION_PROFILE_JSON }}
          PI_NATIVE_CONTROL_RECEIPT: ${{ runner.temp }}/pi-native-control-probe-receipt.json
      - name: Upload only the sanitized native control receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-control-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pi-native-control-probe-receipt.json
          retention-days: 1
          if-no-files-found: error
