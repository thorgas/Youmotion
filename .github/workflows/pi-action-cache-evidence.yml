name: pi-action cache evidence
on: workflow_dispatch
permissions: {}
jobs:
  cache:
    if: github.actor == github.repository_owner && github.repository == 'thorgas/Youmotion'
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ github.workspace }}/pi-action-harness
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: 3bc1ff8434e9e168492ed21015d3a90d0b9c3aae
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          persist-credentials: false
          path: pi-action-harness
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/pi-action-native-cache
          key: pi-action-native-a164efa823826e776707b894e683d5e550cdd722258b10545edde5e95402aa12-88f100199dae4f1dba8b654d1953c176e242375cf3bf8b22752ea52dbba309ac
      - run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent
      - name: Write metadata-only bootstrap probe
        run: |
          cat > parity-probe.mjs <<'JS'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {dirname} from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {nativeProducerVocabulary,nativeCandidatePreparationVocabulary} from './packages/protocol/src/constants.ts';
          const p=JSON.parse(process.env.PROFILE);const b=p.preparation.build;
          const build={executable:b.executable,arguments:b.arguments,environment:{PATH:dirname(process.execPath)+':'+process.env.PATH,...b.environment,CI:b.environment.CI??'1',EXPO_PUBLIC_E2E:b.environment.EXPO_PUBLIC_E2E??'1',MOBILE_UPDATE_CHANNEL:b.environment.MOBILE_UPDATE_CHANNEL??'none',USE_CCACHE:b.environment.USE_CCACHE??'0',...nativeCandidatePreparationVocabulary.environment}};
          const toolchain={xcode:execFileSync('/usr/bin/xcodebuild',['-version'],{encoding:'utf8'}).trim(),simulatorSdk:execFileSync('/usr/bin/xcrun',['--sdk','iphonesimulator','--show-sdk-version'],{encoding:'utf8'}).trim(),node:process.version};
          const parts={policy:nativeProducerVocabulary.policy.name,policyVersion:nativeProducerVocabulary.policy.version,inputManifestHash:'d05e8b401dbbc3e0662e69360d997109199a19a7158101195de37f1272ec3d94',toolchain,build,bundleId:p.preparation.bundleId,expoSdkMajor:p.preparation.expoSdkMajor,architecture:'arm64',simulatorOsVersion:p.native.simulatorOsVersion};
          const fingerprint=createHash('sha256').update(JSON.stringify(parts)).digest('hex');
          console.log(JSON.stringify({_tag:'NativeRecipeParity',fingerprint,parts}));
          const {makeNativeBuildProducer}=await import('./packages/runner/src/native-build-producer.ts');const Effect=await import('effect/Effect');const fs=await import('node:fs');const path=await import('node:path');const root=process.env.PI_ACTION_RUN_ROOT;const receipt=JSON.parse(fs.readFileSync(root+'/pi-action-native-cache/bundle/producer-receipt.json','utf8'));for(const d of ['probe-output','probe-receipts'])fs.mkdirSync(root+'/'+d,{mode:448,recursive:true});
          const result=await Effect.runPromise(Effect.gen(function*(){const producer=yield* makeNativeBuildProducer({taskId:receipt.request.taskId,candidateCommitOid:receipt.request.candidateCommitOid,artifactId:receipt.artifact.artifactId,preparedRoot:root+'/pi-action-native-cache/seed',outputRoot:root+'/probe-output',receiptRoot:root+'/probe-receipts',inputPaths:nativeCandidatePreparationVocabulary.nativeInputs,artifactPath:p.preparation.artifactPath,bundleId:p.preparation.bundleId,expoSdkMajor:p.preparation.expoSdkMajor,architecture:'arm64',simulatorOsVersion:p.native.simulatorOsVersion,build});return yield* producer.fingerprint({policyVersion:receipt.policyVersion});}));console.log(JSON.stringify({_tag:'CacheProductionParity',fingerprintMatches:result.nativeFingerprint===receipt.nativeFingerprint,inputMatches:result.inputManifestHash===receipt.inputManifestHash,toolchainMatches:JSON.stringify(result.toolchain)===JSON.stringify(receipt.toolchain),actual:result}));process.exit(1);
          JS
          printf '{}' > parity-profile.json
      - name: Probe exact session action bootstrap environment without coding
        continue-on-error: true
        uses: ./pi-action-harness/tooling/github-actions/session-action
        env:
          PROFILE: ${{ vars.PI_ACTION_PROFILE_JSON }}
          PI_ACTION_PROFILE: parity-profile.json
          PI_ACTION_SESSION_PREPARE_SCRIPT: parity-probe.mjs
          PI_ACTION_RUN_ROOT: ${{ runner.temp }}
          PI_ACTION_DEADLINE: '0'
          PI_ACTION_TUNNEL_EXECUTABLE: /usr/bin/true
