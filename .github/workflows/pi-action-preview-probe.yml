name: pi-action native SDK startup probe
on: workflow_dispatch
permissions: {}
jobs:
  preview:
    if: github.actor == github.repository_owner && github.repository == 'thorgas/Youmotion'
    runs-on: macos-26
    timeout-minutes: 12
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/pi-action-harness
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: aa9402bd6210f52b3c8fcaf3c42d7e361553ad22
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          persist-credentials: false
          path: pi-action-harness
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/pi-action-native-cache
          key: ${{ vars.PI_ACTION_NATIVE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Measure isolated real SDK startup without Pi or App credentials
        env:
          NODE_NO_WARNINGS: '1'
        run: |
          set -euo pipefail
          umask 077
          device="$(xcrun simctl create pi-action-sdk-startup-probe com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-2)"
          trap 'xcrun simctl delete "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b >/dev/null
          app="$RUNNER_TEMP/pi-action-native-cache/bundle/artifact.app"
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$device" "$app"
          pid="$(xcrun simctl launch "$device" com.youmotion.mobile | sed -E 's/.*: ([0-9]+)$/\1/')"
          export PROBE_DEVICE="$device" PROBE_PID="$pid"
          node --input-type=module -e 'import{readFileSync,writeFileSync}from"node:fs";const p="packages/protocol/src/constants.ts",s=readFileSync(p,"utf8"),a="commandMs: 120000, configBytes: 4096, startupMs: 60000";if(!s.includes(a))throw Error("Unexpected probe source");writeFileSync(p,s.replace(a,"commandMs: 120000, configBytes: 4096, startupMs: 120000"));'
          mkdir -p .local/cache-import-e2e-2026-10-24
          cat > .local/cache-import-e2e-2026-10-24/sdk-startup-probe.mjs <<'JS'
          import * as Effect from 'effect/Effect';import * as Exit from 'effect/Exit';import {mkdir,realpath} from 'node:fs/promises';import {dirname,join} from 'node:path';import {makeSimulatorNativeInput} from '../../packages/runner/src/native-input.ts';import {nativeAdapterVocabulary as adapter,nativeControlProofVocabulary as proof} from '../../packages/protocol/src/constants.ts';
          const emit=e=>process.stdout.write(JSON.stringify({_tag:'NativeSdkStartupProbe',...e})+'\n');
          const root=join(process.env.RUNNER_TEMP,'pi-sdk-startup-probe');await mkdir(root,{mode:0o700});const stateRoot=await realpath(root);const started=Date.now();const parentMs=proof.limits.startupMs+proof.limits.daemonStopMs+proof.limits.cleanupJoinMs;
          emit({status:'started',productionStartupMs:60000,diagnosticChildMs:proof.limits.startupMs,diagnosticParentMs:parentMs,actualAppQa:false});
          const binding={taskId:'sdk-probe',operationId:'binding-1',attemptId:'attempt-1',generation:1,preparationOperationId:'prepare-1',deviceId:process.env.PROBE_DEVICE,bindingManifestHash:'b'.repeat(64),owner:'agent',preparationResourceId:'c'.repeat(64),allocationManifestHash:'f'.repeat(64),initialEpoch:1};
          const exit=await Effect.runPromiseExit(Effect.scoped(makeSimulatorNativeInput({assignment:{binding,bundleId:'com.youmotion.mobile',stateRoot,expectedAppPid:Number(process.env.PROBE_PID),readinessLabel:'Settings'},environment:{PATH:dirname(process.execPath)+':/usr/bin:/bin:/usr/sbin:/sbin',HOME:stateRoot,TMPDIR:stateRoot},scheduleTimeout:({milliseconds,onTimeout})=>{const t=setTimeout(onTimeout,milliseconds===adapter.limits.startupMs?parentMs:milliseconds);return()=>clearTimeout(t);}})));
          if(Exit.isSuccess(exit))emit({status:'ready',elapsedMs:Date.now()-started,nodeCount:exit.value.snapshot.nodes?.length??0,coldStartupExceedsProduction:Date.now()-started>60000,cleanupJoined:true});else{const failure=exit.cause.reasons.find(r=>r._tag==='Fail')?.error;emit({status:'failed',elapsedMs:Date.now()-started,diagnostic:failure?.startupDiagnostic??null,cleanupJoined:true});process.exitCode=1;}
          JS
          node .local/cache-import-e2e-2026-10-24/sdk-startup-probe.mjs
