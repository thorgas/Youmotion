name: pi-action native app QA probe
on: workflow_dispatch
permissions: {}
jobs:
  preview:
    if: github.actor == github.repository_owner && github.repository == 'thorgas/Youmotion'
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}/pi-action-harness
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: 8e2f823ba5b0bfc58c9fa0365bc71d2188f79e92
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          persist-credentials: false
          path: pi-action-harness
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: c0e1f445903238cd94b1420dddb12ce3450782a9
          persist-credentials: false
          path: native-app-source
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --reporter=silent
      - uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ${{ runner.temp }}/pi-action-native-cache
          key: ${{ vars.PI_ACTION_NATIVE_CACHE_KEY }}
          fail-on-cache-miss: true
      - name: Reproduce cached actual app QA without Pi or App credentials
        env:
          NODE_NO_WARNINGS: "1"
        run: |
          set -euo pipefail
          umask 077
          app_source="$GITHUB_WORKSPACE/native-app-source"
          cp -R "$RUNNER_TEMP/pi-action-native-cache/seed/node_modules" "$app_source/node_modules"
          app_home="$RUNNER_TEMP/native-app-home"; app_tmp="$RUNNER_TEMP/native-app-tmp"
          mkdir -m 700 "$app_home" "$app_tmp"
          trusted_node="$(command -v node)"
          cd "$app_source"
          env -i PATH="$PATH" HOME="$app_home" TMPDIR="$app_tmp" LANG=en_US.UTF-8 CI=1 EXPO_PUBLIC_E2E=true EXPO_NO_DOTENV=1 EXPO_NO_TELEMETRY=1 MOBILE_UPDATE_CHANNEL=none pnpm i18n:all > "$RUNNER_TEMP/native-app-i18n.log" 2>&1
          env -i PATH="$PATH" HOME="$app_home" TMPDIR="$app_tmp" LANG=en_US.UTF-8 CI=1 EXPO_PUBLIC_E2E=true EXPO_NO_DOTENV=1 EXPO_NO_TELEMETRY=1 MOBILE_UPDATE_CHANNEL=none NODE_OPTIONS=--dns-result-order=ipv4first "$trusted_node" node_modules/expo/bin/cli start --dev-client --localhost --port 8084 > "$RUNNER_TEMP/native-app-metro.log" 2>&1 &
          metro_pid=$!
          cd "$GITHUB_WORKSPACE/pi-action-harness"
          device="$(xcrun simctl create pi-action-native-app-probe com.apple.CoreSimulator.SimDeviceType.iPhone-17 com.apple.CoreSimulator.SimRuntime.iOS-26-2)"
          trap 'xcrun simctl io "$device" screenshot "$RUNNER_TEMP/native-app-after.png" >/dev/null 2>&1 || true; kill "$metro_pid" >/dev/null 2>&1 || true; xcrun simctl delete "$device" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b >/dev/null
          app="$RUNNER_TEMP/pi-action-native-cache/bundle/artifact.app"
          codesign --verify --deep --strict "$app"
          xcrun simctl install "$device" "$app"
          mkdir -p .local/cache-import-e2e-2026-10-24
          printf '%s' "$device" > .local/cache-import-e2e-2026-10-24/native-input-device2.txt
          xcrun simctl launch "$device" com.youmotion.mobile > .local/cache-import-e2e-2026-10-24/native-input-app-pid2.txt
          for attempt in {1..120}; do if curl -fsS http://127.0.0.1:8084/status > /dev/null; then break; fi; sleep 2; done
          curl -fsS http://127.0.0.1:8084/status > /dev/null
          xcrun simctl openurl "$device" 'exp+youmotion://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8084&disableOnboarding=1'
          xcrun simctl io "$device" screenshot "$RUNNER_TEMP/native-app-before.png" >/dev/null 2>&1
          cat > .local/cache-import-e2e-2026-10-24/native-app-hosted-repro.mjs <<'JS'
          import assert from 'node:assert/strict';
          import * as Effect from 'effect/Effect';import * as Exit from 'effect/Exit';
          import {mkdtemp,realpath,readFile,writeFile} from 'node:fs/promises';import {tmpdir} from 'node:os';import {join} from 'node:path';
          const fixtureConfiguration=()=>({native:{qaLabel:'Settings',agentQa:false,deepLinkScheme:'exp+youmotion',metroPort:8084}});
           const {runSessionQa}=await import('../../apps/cli/src/session-runtime.ts');
           const {makeSqliteTaskStore}=await import('../../packages/task-store/src/sqlite.ts');
           const {makeTaskStorage}=await import('../../packages/core/src/tasks.ts');
           const {makePreparationExclusivity}=await import('../../packages/runner/src/preparation-lock.ts');
           const {reduceTaskLifecycle,reducePreparationLifecycle}=await import('../../packages/core/src/task-machine.ts');
           const {fork}=await import('node:child_process');
           for(const expectedReady of [true]){
           const directory=await realpath(await mkdtemp(join(tmpdir(),'pi-qa-navigation-')));
           try{await Effect.runPromise(Effect.scoped(Effect.gen(function*(){
            const now=()=>1;const store=yield* Effect.acquireRelease(makeSqliteTaskStore({path:':memory:',now}),(owned)=>owned.close.pipe(Effect.orDie));
            const taskId='fixture-task';yield* store.admit({taskId,requestId:'request-1',payloadHash:'a'.repeat(64),initialBudget:3});
            yield* store.acquireLease({taskId,operationId:'lease-1',attemptId:'attempt-1',workerId:'worker-1',expectedGeneration:0,expiresAt:now()+60000});
            const staged=yield* store.stageLifecycle({taskId,eventId:'prepare-1',expectedCursor:0,type:'PREPARE_REQUESTED',attemptId:'attempt-1',generation:1},reduceTaskLifecycle);
            const prepared=yield* store.issuePreparation({taskId,operationId:staged.outbox[0].operationId,attemptId:'attempt-1',generation:1,expectedCursor:staged.checkpoint.cursor,runnerId:'runner-1'});
            yield* store.recordPreparationObservation(prepared.permit,{...prepared.permit,outcome:'allocated',manifestHash:'f'.repeat(64)},reducePreparationLifecycle);
            const deviceId=(yield* Effect.promise(()=>readFile(new URL('./native-input-device2.txt',import.meta.url),'utf8'))).trim();const appPid=Number((yield* Effect.promise(()=>readFile(new URL('./native-input-app-pid2.txt',import.meta.url),'utf8'))).trim().split(': ')[1]);
            const ownership=yield* store.bindSimulatorControl({taskId,operationId:'control-bind-1',preparationOperationId:prepared.permit.operationId,attemptId:'attempt-1',generation:1,deviceId,bindingManifestHash:'b'.repeat(64),owner:'agent'});
            const route=join(directory,'route.json');yield* Effect.promise(()=>writeFile(route,JSON.stringify({labels:expectedReady?['Open','Close','Skip','Today','Settings']:['Unreviewed','Close','Skip','Today','Settings'],index:0}),{mode:0o600}));
            const config=fixtureConfiguration(directory);config.deadline=Date.now()+900000;config.native.qaStartupLabels=['Open','Close','Skip','Today'];config.native.qaScreenLabels=['TODAY'];
            const lock=yield* makePreparationExclusivity({directory});const telemetry=yield* makeSessionTelemetry(directory);
            const result=yield* Effect.exit(runSessionQa({config,codingOptions:{},storage:makeTaskStorage(store),lock,telemetry,candidate:{taskId,candidateHash:'a'.repeat(64),writerRevision:1},ownership,launched:{bundleId:'com.youmotion.mobile',appPid},stateRoot:directory,qaOperationId:'qa-input'}));
            assert.equal(Exit.isSuccess(result),expectedReady);if(Exit.isSuccess(result))assert.equal(result.value.input.status.phase,'ready');assert.ok(Exit.isSuccess(result));if(Exit.isSuccess(result))assert.ok(result.value.snapshot.nodes.some(node=>node.label.includes('Settings')));
           })));}finally{console.log(JSON.stringify({localEvidenceRoot:directory}));}
           }
          JS
          if node .local/cache-import-e2e-2026-10-24/native-app-hosted-repro.mjs > "$RUNNER_TEMP/native-app-qa-private.log" 2>&1; then
            printf '%s\n' '{"_tag":"NativeAppQaProbe","status":"ready","actualPiSourceAuthority":false,"actualPiQa":false}'
          else
            printf '%s\n' '{"_tag":"NativeAppQaProbe","status":"failed","actualPiSourceAuthority":false,"actualPiQa":false}'
            exit 1
          fi
      - name: Upload only synthetic app screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-app-probe-screenshots
          path: ${{ runner.temp }}/native-app-*.png
          retention-days: 1
          if-no-files-found: ignore
