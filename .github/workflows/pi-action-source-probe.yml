name: Source materialization probe
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    if: github.repository == 'thorgas/Youmotion' && github.actor == 'thorgas'
    runs-on: macos-26
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
        working-directory: pi-action-harness
    steps:
      - name: Checkout immutable trusted harness
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: 309e9e4bc05ca9dd43b0b4174ed6447226389de1
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          path: pi-action-harness
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          architecture: arm64
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.21.0
          run_install: false
      - name: Install exact trusted dependency graph
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optimistic-repeat-install
      - name: Probe exact public source through real LocalCoding
        env:
          NODE_NO_WARNINGS: '1'
        run: |
          set -euo pipefail
          umask 077
          probe_root="$(mktemp -d "$RUNNER_TEMP/pi-source-materialization.XXXXXX")"
          probe_root="$(node -e 'process.stdout.write(require("node:fs").realpathSync(process.argv[1]))' "$probe_root")"
          trap 'rm -rf -- "$probe_root"' EXIT
          cat > "$probe_root/fetch.mjs" <<'FETCH'
          import {mkdir,realpath} from 'node:fs/promises';
          import {join} from 'node:path';
          import {spawn} from 'node:child_process';
          const root=await realpath(process.argv[2]);
          const gitDir=join(root,'public.git');
          const env={PATH:'/usr/bin:/bin:/usr/sbin:/sbin',HOME:root,TMPDIR:root,GIT_CONFIG_NOSYSTEM:'1',GIT_CONFIG_GLOBAL:'/dev/null',GIT_CONFIG_SYSTEM:'/dev/null',GIT_TERMINAL_PROMPT:'0'};
          const run=(args,kind)=>new Promise(resolve=>{
           const started=Date.now();let timedOut=false,spawnFailed=false,bytes=0;
           const child=spawn('/usr/bin/git',args,{env,cwd:root,detached:true,stdio:['ignore','pipe','pipe']});
           const timer=setTimeout(()=>{timedOut=true;try{process.kill(-child.pid,'SIGKILL');}catch{}},120000);
           child.stdout.on('data',chunk=>{bytes+=chunk.length;});child.stderr.on('data',()=>{});
           child.once('error',()=>{spawnFailed=true;});
           child.once('close',code=>{clearTimeout(timer);const status=timedOut?'timeout':spawnFailed?'spawn-failed':code===0?'completed':'exit';process.stdout.write(`${JSON.stringify({_tag:'SourceProbeFetch',kind,status,elapsedMs:Date.now()-started,bytes,...(Number.isInteger(code)?{exitCode:code}:{})})}\n`);resolve(status==='completed');});
          });
          let ok=false;
          try{
           await mkdir(join(root,'runtime'),{mode:0o700});
           ok=await run(['init','--bare','--quiet',gitDir],'initialize');
           if(ok)ok=await run(['--no-lazy-fetch','--no-replace-objects','--no-optional-locks','--git-dir',gitDir,'-c','core.hooksPath=/dev/null','fetch','--no-tags','--depth=1','https://github.com/thorgas/Youmotion.git','ff280052a3e7e4f729471ede5c3cf1b06d11f25d'],'fetch');
          }catch{process.stdout.write('{"_tag":"SourceProbeFetch","kind":"setup","status":"failed"}\n');}
          if(!ok)process.exitCode=1;
          FETCH
          node "$probe_root/fetch.mjs" "$probe_root"
          cat > "$probe_root/probe.mjs" <<'PROBE'
          import { strict as assert } from 'node:assert';
          import { mkdir, realpath, lstat, readFile, readdir } from 'node:fs/promises';
          import { join, resolve } from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { createRequire } from 'node:module';
          const require = createRequire(join(process.cwd(), 'package.json'));
          const dependency = (specifier) => import(pathToFileURL(require.resolve(specifier)).href);
          const load = (path) => import(pathToFileURL(join(process.cwd(), path)).href);
          let phase = 'configuration'; let calls = 0; const started = Date.now();
          try {
            const root = resolve(process.argv[2]); const objects = resolve(process.argv[3]); const commit = process.argv[4];
            assert.equal(await realpath(root), root); assert.equal(await realpath(objects), objects);
            const info = await lstat(root); assert.ok(info.isDirectory() && !info.isSymbolicLink() && info.uid === process.getuid() && (info.mode & 0o777) === 0o700);
            assert.match(commit, /^[a-f0-9]{40}$/);
            const [Effect, Exit, { makeLocalCoding }, { createModels }, { fauxProvider, fauxAssistantMessage }, { sourceSnapshotVocabulary, localCodingVocabulary, preparationVocabulary }] = await Promise.all([
              dependency('effect/Effect'), dependency('effect/Exit'), load('packages/runner/src/local-coding.ts'), load('node_modules/@earendil-works/pi-ai/dist/models.js'), load('node_modules/@earendil-works/pi-ai/dist/providers/faux.js'), load('packages/protocol/src/constants.ts'),
            ]);
            for (const name of ['sources', 'edits', 'candidates']) await mkdir(join(root, name), { mode: 0o700 });
            const provider = fauxProvider(); provider.setResponses([() => { calls += 1; return fauxAssistantMessage('Controlled source boundary complete.'); }]);
            const models = createModels(); models.setProvider(provider.provider); const model = provider.getModel();
            const options = { statePath: join(root, localCodingVocabulary.files.state), harnessPath: join(root, localCodingVocabulary.files.harness), workspaceRoot: join(root, preparationVocabulary.files.root), metadataRoot: join(root, 'sources'), journalRoot: join(root, 'edits'), candidateRoot: join(root, 'candidates'), registry: [{ sourceId: 'public-source-probe', commitOid: commit, objectFormat: 'sha1', pathPolicyVersion: sourceSnapshotVocabulary.applicationProfile.version, selection: sourceSnapshotVocabulary.applicationProfile.selection, objectDirectory: objects }], gitExecutable: '/usr/bin/git', models, model, now: Date.now, maxRequests: 1, maxTokens: 128, runMs: sourceSnapshotVocabulary.applicationProfile.limits.totalMs, activity: { report(event) { phase = event.phase; process.stdout.write(`${JSON.stringify(event)}\n`); } } };
            phase = 'source-materialization';
            const exit = await Effect.runPromiseExit(Effect.scoped(Effect.gen(function* () { const coding = yield* makeLocalCoding(options); return yield* coding.run({ taskId: 'public-source-probe', requestId: 'public-source-probe-request', sourceId: 'public-source-probe', prompt: 'Retain the assigned source unchanged. Do not call tools.' }); })));
            if (Exit.isFailure(exit)) throw new Error('ControlledFailure');
            assert.equal(calls, 1); assert.equal(exit.value.writerRevision, 0);
            const receipts = [];
            const visit = async (path) => { for (const entry of await readdir(path, { withFileTypes: true })) { const child = join(path, entry.name); if (entry.isDirectory()) await visit(child); else if (entry.name === sourceSnapshotVocabulary.files.receipt) { const value = JSON.parse(await readFile(child, 'utf8')); if (value.receipt?.commitOid === commit) receipts.push(value.receipt); } } };
            await visit(options.metadataRoot); assert.equal(receipts.length, 1);
            process.stdout.write(`${JSON.stringify({ _tag: 'SourceMaterializationProbe', status: 'completed', phase: 'source-materialization', files: receipts[0].fileCount, bytes: receipts[0].totalBytes, fauxRequests: calls, writerRevision: exit.value.writerRevision, elapsedMs: Date.now() - started })}\n`);
          } catch {
            process.stdout.write(`${JSON.stringify({ _tag: 'SourceMaterializationProbe', status: 'failed', phase, fauxRequests: calls, elapsedMs: Date.now() - started })}\n`);
            process.exitCode = 1;
          }
          PROBE
          node "$probe_root/probe.mjs" "$probe_root/runtime" "$probe_root/public.git/objects" ff280052a3e7e4f729471ede5c3cf1b06d11f25d
