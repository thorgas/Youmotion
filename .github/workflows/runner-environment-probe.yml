name: pi-action runner environment proof
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: pi-action-runner-environment-proof-${{ github.repository }}
  cancel-in-progress: false
jobs:
  runner-environment:
    if: >-
      github.repository == 'thorgas/Youmotion' &&
      github.actor == github.repository_owner &&
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-26
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      runner-image: ${{ steps.environment.outputs.runner-image }}
      host-architecture: ${{ steps.environment.outputs.host-architecture }}
      node-version: ${{ steps.environment.outputs.node-version }}
      pnpm-version: ${{ steps.environment.outputs.pnpm-version }}
      job-timeout-minutes: ${{ steps.environment.outputs.job-timeout-minutes }}
      artifact-retention-days: ${{ steps.environment.outputs.artifact-retention-days }}
      cleanup-reserve-ms: ${{ steps.environment.outputs.cleanup-reserve-ms }}
      configuration-hash: ${{ steps.environment.outputs.configuration-hash }}
    steps:
      - name: Checkout immutable private harness
        if: ${{ !env.ACT }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: 522d176d8cdd357b2d0d0471b1617c491fc08c53
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          path: pi-action-harness
          persist-credentials: false
      - name: Set up trusted bootstrap Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24.21.0
          architecture: arm64
      - name: Resolve reviewed runner environment
        id: environment
        working-directory: ${{ env.ACT && env.PI_ACTION_WORKSPACE || format('{0}/pi-action-harness', github.workspace) }}
        env:
          REVIEWED_RUNNER_ENVIRONMENT_JSON: ${{ vars.PI_ACTION_RUNNER_ENVIRONMENT_JSON || '{}' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdtempSync, realpathSync, writeFileSync, rmSync } from 'node:fs';
          import { join } from 'node:path';
          import { runRunnerEnvironment } from './tooling/runner-environment.mjs';
          try {
            const reviewed = process.env.REVIEWED_RUNNER_ENVIRONMENT_JSON ?? '{}';
            if (Buffer.byteLength(reviewed) > 16384) throw new Error();
            const directory = mkdtempSync(join(realpathSync(process.env.RUNNER_TEMP), 'pi-runner-environment-'));
            try {
              const path = join(directory, 'reviewed.json');
              writeFileSync(path, reviewed, { mode: 0o600, flag: 'wx' });
              console.log(JSON.stringify(runRunnerEnvironment([path, '--github-output', process.env.GITHUB_OUTPUT])));
            } finally { rmSync(directory, { recursive: true, force: true }); }
          } catch { console.error('{"_tag":"RunnerEnvironmentInvalid"}'); process.exitCode = 1; }
          NODE
  preflight:
    needs: runner-environment
    if: >-
      github.repository == 'thorgas/Youmotion' &&
      github.actor == github.repository_owner &&
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ${{ needs.runner-environment.outputs.runner-image }}
    timeout-minutes: ${{ fromJSON(needs.runner-environment.outputs.job-timeout-minutes) }}
    permissions:
      contents: read
    env:
      PI_ACTION_RUNNER_ENVIRONMENT_HASH: ${{ needs.runner-environment.outputs.configuration-hash }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ env.ACT && env.PI_ACTION_WORKSPACE || format('{0}/pi-action-harness', github.workspace) }}
    steps:
      - name: Create private preflight receipt directory
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          umask 077
          proof_root=$(mktemp -d "$RUNNER_TEMP/pi-action-toolchain-proof.XXXXXX")
          printf 'PI_ACTION_RUN_ROOT=%s\n' "$proof_root" >> "$GITHUB_ENV"
      - name: Checkout immutable private harness
        if: ${{ !env.ACT }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          repository: thorgas/pi-action
          ref: 522d176d8cdd357b2d0d0471b1617c491fc08c53
          token: ${{ secrets.PI_ACTION_HARNESS_READ_TOKEN }}
          path: pi-action-harness
          persist-credentials: false
      - name: Set up pinned Node
        if: ${{ !env.ACT }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ needs.runner-environment.outputs.node-version }}
          architecture: ${{ needs.runner-environment.outputs.host-architecture }}
      - name: Set up pinned pnpm
        if: ${{ !env.ACT }}
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: ${{ needs.runner-environment.outputs.pnpm-version }}
          run_install: false
      - name: Select and verify the reviewed native toolchain
        env:
          REVIEWED_RUNNER_ENVIRONMENT_JSON: ${{ vars.PI_ACTION_RUNNER_ENVIRONMENT_JSON || '{}' }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { constants, openSync, closeSync, fstatSync, fchmodSync, ftruncateSync, realpathSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { preflightRunnerToolchain, RunnerToolchainError } from './tooling/runner-toolchain.mjs';
          const writeReceipt = value => {
            const path = join(realpathSync(process.env.PI_ACTION_RUN_ROOT), 'runner-toolchain-receipt.json');
            const descriptor = openSync(path, constants.O_WRONLY | constants.O_CREAT | constants.O_NOFOLLOW | constants.O_NONBLOCK, 0o600);
            try {
              const info = fstatSync(descriptor);
              if (!info.isFile() || info.nlink !== 1 || info.uid !== process.getuid()) throw new Error();
              fchmodSync(descriptor, 0o600); ftruncateSync(descriptor, 0);
              writeFileSync(descriptor, JSON.stringify(value));
            } finally { closeSync(descriptor); }
          };
          try {
            const reviewed = process.env.REVIEWED_RUNNER_ENVIRONMENT_JSON ?? '{}';
            if (Buffer.byteLength(reviewed) > 16384) throw new Error();
            const { environment, ...receipt } = await preflightRunnerToolchain(JSON.parse(reviewed));
            if (!receipt.match || receipt.hash !== process.env.PI_ACTION_RUNNER_ENVIRONMENT_HASH) throw new Error();
            writeReceipt(receipt);
            const path = process.env.GITHUB_ENV;
            if (realpathSync(path) !== path) throw new Error();
            const descriptor = openSync(path, constants.O_WRONLY | constants.O_APPEND | constants.O_NOFOLLOW | constants.O_NONBLOCK);
            try {
              const info = fstatSync(descriptor);
              if (!info.isFile() || info.nlink !== 1 || info.uid !== process.getuid()) throw new Error();
              writeFileSync(descriptor, `DEVELOPER_DIR=${environment.DEVELOPER_DIR}\n`);
            } finally { closeSync(descriptor); }
            console.log(JSON.stringify(receipt));
          } catch (error) {
            const code = error instanceof RunnerToolchainError && ['invalid', 'unavailable', 'timeout', 'output-limit', 'malformed', 'mismatch'].includes(error.code) ? error.code : 'unknown';
            const stage = error instanceof RunnerToolchainError && ['configuration', 'node', 'pnpm', 'architecture', 'host', 'selection', 'xcode', 'sdk'].includes(error.stage) ? error.stage : 'unknown';
            const failure = { code, stage };
            const receipt = error instanceof RunnerToolchainError && error.receipt?.match === false ? { ...error.receipt, failure } : { match: false, failure };
            try { writeReceipt(receipt); } catch {}
            console.error(JSON.stringify({ _tag: 'RunnerToolchainFailed', code, stage })); process.exitCode = 1;
          }
          NODE
      - name: Upload the finite toolchain receipt
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pi-action-runner-environment-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.PI_ACTION_RUN_ROOT }}/runner-toolchain-receipt.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: ${{ fromJSON(needs.runner-environment.outputs.artifact-retention-days) }}
