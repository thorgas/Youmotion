appId: com.youmotion.mobile
name: Save, find, and delete a check-in
tags:
  - check-in
  - persistence
  - deletion
---
- evalScript: ${output.checkInNote = "MaestroTestEntry" + new Date().getTime()}
- evalScript: ${output.checkInNotePattern = ".*" + output.checkInNote + ".*"}
- runFlow: ../helpers/open-app.yaml
- tapOn:
    id: tab-today
- swipe:
    start: 50%, 54%
    end: 50%, 34%
    duration: 1000
- extendedWaitUntil:
    visible:
      id: reflection-screen
    timeout: 10000
- tapOn:
    id: reflection-note-input
- inputText: ${output.checkInNote}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reflection-save
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: reflection-save
- extendedWaitUntil:
    visible:
      id: belief-system-step
    timeout: 10000
- tapOn:
    id: belief-system-browse
- extendedWaitUntil:
    visible:
      id: belief-system-catalog
    timeout: 10000
- tapOn:
    id: belief-system-option-always-functioning
- extendedWaitUntil:
    visible:
      id: belief-system-finish
    timeout: 10000
- tapOn:
    id: belief-system-finish
- extendedWaitUntil:
    visible:
      id: success-screen
    timeout: 10000
- tapOn:
    id: check-in-done
- tapOn:
    id: tab-history
- extendedWaitUntil:
    visible: ${output.checkInNotePattern}
    timeout: 10000
- longPressOn:
    id: 'history-moment-.*'
    index: 0
- tapOn: Delete
- assertNotVisible: ${output.checkInNotePattern}
