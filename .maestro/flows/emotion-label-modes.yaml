appId: com.youmotion.mobile
name: Drag the emotion star in every label mode
tags:
  - check-in
  - settings
  - interaction
---
- runFlow: ../helpers/open-app.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-emoji
- tapOn:
    id: tab-today
- assertNotVisible: Disgust
- assertVisible: 🤢
- swipe:
    start: 50%, 51%
    end: 75%, 40%
    duration: 1600
- extendedWaitUntil:
    visible:
      id: reflection-screen
    timeout: 10000
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reflection-back
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: reflection-back
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-text
- tapOn:
    id: tab-today
- assertVisible: Disgust
- swipe:
    start: 50%, 51%
    end: 75%, 40%
    duration: 1600
- extendedWaitUntil:
    visible:
      id: reflection-screen
    timeout: 10000
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reflection-back
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: reflection-back
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-both
- tapOn:
    id: tab-today
- assertVisible: Disgust
- assertVisible: 🤢
- swipe:
    start: 50%, 51%
    end: 75%, 40%
    duration: 1600
- extendedWaitUntil:
    visible:
      id: reflection-screen
    timeout: 10000
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reflection-back
    direction: DOWN
    timeout: 10000
    speed: 40
- tapOn:
    id: reflection-back
- tapOn:
    id: tab-history
- assertVisible:
    id: history-screen
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-emoji
