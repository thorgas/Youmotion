appId: com.youmotion.mobile
name: Switch language and restore English
tags:
  - settings
---
- runFlow: ../helpers/open-app.yaml
- tapOn:
    id: tab-settings
- tapOn:
    id: language-german
- extendedWaitUntil:
    visible: Dein Raum.
    timeout: 10000
- tapOn:
    id: language-english
- extendedWaitUntil:
    visible: Your space.
    timeout: 10000
- tapOn:
    id: emotion-label-mode-text
- tapOn:
    id: tab-today
- assertVisible: Disgust
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-both
- tapOn:
    id: tab-today
- assertVisible: Disgust
- assertVisible: 🤢
- tapOn:
    id: tab-settings
- tapOn:
    id: emotion-label-mode-emoji
- tapOn:
    id: tab-today
- assertNotVisible: Disgust
- assertVisible: 🤢
