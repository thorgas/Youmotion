appId: com.youmotion.mobile
name: Release onboarding follows the Android system locale
tags:
  - release
  - localization
  - onboarding
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: ${EXPECTED_ONBOARDING_TITLE}
    timeout: 30000
- assertNotVisible: ${UNEXPECTED_ONBOARDING_TITLE}
- launchApp
- extendedWaitUntil:
    visible: ${EXPECTED_ONBOARDING_TITLE}
    timeout: 30000
- assertNotVisible: ${UNEXPECTED_ONBOARDING_TITLE}
