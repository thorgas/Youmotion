appId: com.youmotion.mobile
name: Create and manage an assignment-owned Leitsatz reminder
tags:
  - reminders
  - persistence
  - privacy
---
- evalScript: ${output.runId = new Date().getTime()}
- evalScript: ${output.note = "ReminderFlow" + output.runId}
- evalScript: ${output.coreBelief = "I must never pause " + output.runId}
- evalScript: ${output.leitsatz = "I can pause with care " + output.runId}
- runFlow: ../helpers/open-app.yaml
- tapOn:
    id: tab-today
- swipe:
    start: 50%, 54%
    end: 50%, 34%
    duration: 1000
- extendedWaitUntil:
    visible:
      id: reflection-screen
    timeout: 10000
- tapOn:
    id: reflection-note-input
- inputText: ${output.note}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: reflection-save
    direction: DOWN
    timeout: 10000
- tapOn:
    id: reflection-save
- extendedWaitUntil:
    visible:
      id: belief-system-step
    timeout: 10000
- tapOn:
    id: belief-system-browse
- tapOn:
    id: create-custom-belief
- tapOn:
    id: belief-system-draft
- inputText: ${output.coreBelief}
- pressKey: Enter
- tapOn:
    id: belief-system-editor-save
- extendedWaitUntil:
    visible:
      id: belief-system-step
    timeout: 10000
- tapOn: Attach and continue
- extendedWaitUntil:
    visible:
      id: guiding-belief-screen
    timeout: 10000
- tapOn:
    id: guiding-belief-draft
- inputText: ${output.leitsatz}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: guiding-belief-finish
    direction: DOWN
    timeout: 10000
- tapOn:
    id: guiding-belief-finish
- extendedWaitUntil:
    visible:
      id: success-reminder-offer
    timeout: 10000
- tapOn:
    id: success-plan-reminder
- tapOn:
    id: reminder-offer-accept
- tapOn:
    text: Allow
    optional: true
- tapOn:
    id: com.android.permissioncontroller:id/permission_allow_button
    optional: true
- extendedWaitUntil:
    visible:
      id: reminder-preview-general
    timeout: 10000
- tapOn:
    id: reminder-preview-full
- tapOn:
    id: reminder-time-picker-0
- tapOn:
    point: 10%,10%
- tapOn:
    id: reminder-save
- extendedWaitUntil:
    visible:
      id: reminder-done
    timeout: 10000
- tapOn:
    id: reminder-done
- tapOn:
    id: check-in-done
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element:
      id: open-belief-library
    direction: DOWN
    timeout: 10000
- tapOn:
    id: open-belief-library
- extendedWaitUntil:
    visible: ${output.leitsatz}
    timeout: 10000
- tapOn:
    id: belief-reminder-edit-.*
    index: 0
- tapOn:
    id: reminder-preview-general
- tapOn:
    id: reminder-save
- tapOn:
    id: reminder-done
- tapOn:
    id: belief-reminder-toggle-.*
    index: 0
- tapOn:
    id: belief-reminder-delete-.*
    index: 0
- tapOn: Delete
- assertVisible: Not set
